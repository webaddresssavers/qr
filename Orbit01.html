<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit Spearmint Gum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: pack-green hero band with the product photo and name, then a two-column spec sheet; language picker sits top right. */
:root{
  --bg:#f2f7f0;
  --surface:#ffffff;
  --ink:#10301b;
  --muted:#52695a;
  --line:#d6e5d7;
  --green:#1f8a3d;
  --green-deep:#146b2d;
  --on-green:#ffffff;
  --blue:#1c4fd6;
  --note-bg:#fff6dc;
  --note-line:#e3b341;
  --note-ink:#4a3600;
  --pack-bg:#ffffff;
  --font-display:"Manrope","Inter",system-ui,sans-serif;
  --font-body:"Inter","Noto Sans Devanagari","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1810;--surface:#132519;--ink:#e5f3e8;--muted:#9cb5a3;--line:#274433;
    --green:#2fae55;--green-deep:#0f4a22;--on-green:#ffffff;--blue:#7da0ff;
    --note-bg:#2d2610;--note-line:#a98524;--note-ink:#f3e2b0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1810;--surface:#132519;--ink:#e5f3e8;--muted:#9cb5a3;--line:#274433;
  --green:#2fae55;--green-deep:#0f4a22;--on-green:#ffffff;--blue:#7da0ff;
  --note-bg:#2d2610;--note-line:#a98524;--note-ink:#f3e2b0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:16px}
.topbar .label{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.picker{display:flex;align-items:center;gap:10px}
.picker label{font-size:.85rem;color:var(--muted);font-weight:500}
.picker select{
  font:inherit;font-weight:600;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--green);border-radius:10px;padding:9px 36px 9px 12px;min-width:180px;
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;
}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.hero{
  background:var(--green);color:var(--on-green);border-radius:20px;
  display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;align-items:center;padding:28px;
}
.pack{background:var(--pack-bg);border-radius:16px;padding:16px;display:flex;justify-content:center}
.pack img{display:block;max-width:100%;height:auto;width:100%;max-height:420px;object-fit:contain}
.hero-text{min-width:0}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;margin:0 0 14px;text-wrap:balance}
.hero p{margin:0 0 20px;font-size:1.05rem;max-width:52ch;opacity:.96}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--green-deep);color:#fff;border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
h2{font-family:var(--font-display);font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:0 0 12px;font-weight:800}
section p{margin:0;max-width:65ch}
.note{background:var(--note-bg);border-color:var(--note-line);color:var(--note-ink)}
.note h2{color:var(--note-ink)}
.note p{font-weight:500}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td:last-child,th:last-child{text-align:end;white-space:nowrap;padding-inline-start:12px}
td[dir="ltr"]{text-align:right}
[dir="rtl"] td[dir="ltr"]{text-align:left}
tr.sub td:first-child{padding-inline-start:22px;color:var(--muted)}
tr.hl td{font-weight:600}
tr:last-child td{border-bottom:0}

dl{margin:0;display:grid;gap:0}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
dt{color:var(--muted);font-size:.9rem}
dd{margin:0;font-weight:600;text-align:end;min-width:0;overflow-wrap:anywhere}
.printed{font-weight:500;color:var(--muted)}
.v{text-align:right}
[dir="rtl"] .v{text-align:left}
[dir="rtl"] .picker select{padding:9px 12px 9px 36px;background-position:18px 55%,13px 55%}
.barcode{margin-top:14px;background:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:center}
.barcode svg{display:block;max-width:100%;height:auto}
@media (max-width:720px){
  .hero{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px;border-radius:16px}
  .pack{max-width:300px;width:100%;margin-inline:auto;padding:12px}
  .hero p{font-size:1rem}
  .topbar{flex-direction:column;align-items:stretch;gap:8px}
  .picker{width:100%}
  .picker select{flex:1;min-width:0;font-size:16px}
  section{padding:18px}
  .grid{gap:16px;margin-top:16px}
  .col{gap:16px}
  th,td{padding:8px 4px}
  .row{flex-direction:column;gap:2px}
  dd,.printed{text-align:start}
  .v{text-align:left}
  [dir="rtl"] .v{text-align:right}
}
</style>

function $(id){return document.getElementById(id)}
function apply(code){
  var t = T[code] || T.en;
  document.documentElement.lang = code;
  document.documentElement.dir = (code === "ar") ? "rtl" : "ltr";
  ["name","desc","ing","warn","dir","h_ing","h_warn","h_dir","h_nut","h_det","nv","per"].forEach(function(k){ $(k).textContent = t[k]; });
  $("sf").textContent = t.sf;
  $("pcs").textContent = "36 " + t.pcs;
  $("netchip").textContent = t.net + ": 29 g";
  $("langLabel").textContent = t.lang;
  document.querySelectorAll("[data-k]").forEach(function(el){ el.textContent = t[el.getAttribute("data-k")]; });
  document.title = "Orbit Spearmint Gum";
}

/* EAN-13 barcode */
function drawEAN(code){
  var L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
  var G=["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
  var R=["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
  var P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  var d = code.split("").map(Number), bits = "101", par = P[d[0]], i;
  for(i=1;i<7;i++) bits += (par[i-1]==="L" ? L : G)[d[i]];
  bits += "01010";
  for(i=7;i<13;i++) bits += R[d[i]];
  bits += "101";
  var m = 12, w = bits.length + m*2, h = 70, rects = "";
  for(i=0;i<bits.length;i++) if(bits[i]==="1"){
    var guard = (i<3 || (i>=45&&i<50) || i>=92), bh = guard ? h+3 : h;
    rects += '<rect x="'+(m+i)+'" y="4" width="1" height="'+bh+'" fill="#000"/>';
  }
  var ty = h + 18, f = 'font-size="9" font-family="Arial,Helvetica,sans-serif" fill="#000"';
  var txt = '<text x="'+(m-3)+'" y="'+ty+'" '+f+' text-anchor="end">'+code[0]+'</text>' +
            '<text x="'+(m+3+21)+'" y="'+ty+'" '+f+' text-anchor="middle" letter-spacing="1.8">'+code.slice(1,7)+'</text>' +
            '<text x="'+(m+50+21)+'" y="'+ty+'" '+f+' text-anchor="middle" letter-spacing="1.8">'+code.slice(7)+'</text>';
  $("barcode").innerHTML = '<svg viewBox="0 0 '+w+' '+(h+22)+'" width="'+(w*1.5)+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="'+w+'" height="'+(h+22)+'" fill="#fff"/>'+rects+txt+'</svg>';
}

var start = "en";
try {
  var saved = localStorage.getItem("orbit-lang");
  var nav = (navigator.language || "en").slice(0,2).toLowerCase();
  start = (saved && T[saved]) ? saved : (T[nav] ? nav : "en");
} catch(e) { var n2 = (navigator.language || "en").slice(0,2).toLowerCase(); start = T[n2] ? n2 : "en"; }
$("lang").value = start;
apply(start);
drawEAN("4009900583077");
$("lang").addEventListener("change", function(e){
  apply(e.target.value);
  try { localStorage.setItem("orbit-lang", e.target.value); } catch(err) {}
});
</script>
