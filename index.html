<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="config.js"></script>
<title>Indian Street Food Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Rozha+One&display=swap">
<style>
/* Layout concept: a kitchen order docket. One ticket per question, a perforated stub with part and number on top,
   warm cream page (light only) that sits with the food photos. Indigo ink, turmeric accent, chili red only for heat. */
:root {
  color-scheme: light;
  --bg: #FFF2DA;
  --surface: #FFFFFF;
  --surface2: #FFE9C4;
  --ink: #141A3D;
  --muted: #6A5A4C;
  --line: #F0D9AE;
  --turmeric: #F4B000;
  --on-turmeric: #141A3D;
  --turmeric-soft: #FFF0C2;
  --chili: #D3342A;
  --leaf: #1F7A58;
  --board: #141A3D;
  --board-ink: #F5F1E3;
  --board-dim: #B9BEDB;
  --focus: #2B4BDB;
  --display: "Rozha One", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pc: #F4B000; --on-pc: #141A3D;
  --wash: var(--bg); --pc-soft: var(--surface2); --pc-tint: var(--surface); --pc-line: var(--line);
}
:root[data-part="A"] { --pc: #5B6CFF; --on-pc: #FFFFFF; }
:root[data-part="B"] { --pc: #FF8A3D; --on-pc: #141A3D; }
:root[data-part="C"] { --pc: #F4B000; --on-pc: #141A3D; }
:root[data-part="D"] { --pc: #2FB67C; --on-pc: #141A3D; }
:root[data-part="E"] { --pc: #E5484D; --on-pc: #141A3D; }
:root[data-part="F"] { --pc: #D6409F; --on-pc: #FFFFFF; }
@supports (background: color-mix(in srgb, red 10%, white)) {
  :root {
    --pc-soft: color-mix(in srgb, var(--pc) 20%, var(--surface));
    --pc-tint: color-mix(in srgb, var(--pc) 7%, var(--surface));
    --pc-line: color-mix(in srgb, var(--pc) 55%, var(--surface));
  }
}
.dishc { --dish: #888; --on-dish: #141A3D; --dish-soft: var(--surface2); --dish-tint: var(--surface2); --dish-line: var(--line); }
@supports (background: color-mix(in srgb, red 10%, white)) {
  .dishc {
    --dish-soft: color-mix(in srgb, var(--dish) 28%, var(--surface));
    --dish-tint: color-mix(in srgb, var(--dish) 12%, var(--surface));
    --dish-line: color-mix(in srgb, var(--dish) 50%, var(--surface));
  }
}
* { box-sizing: border-box; }
body { background: var(--wash); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.app { max-width: 680px; margin: 0 auto; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100%; display: flex; flex-direction: column; gap: 14px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand .em { font-family: var(--body); }
.brand { font-family: var(--display); font-size: 19px; letter-spacing: .01em; line-height: 1.1; }
.brand small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 34px; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip-mode { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; min-height: 34px; }
.chip-mode i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.chip-mode.rec { color: var(--ink); border-color: var(--leaf); }
.chip-mode.rec i { background: var(--leaf); }
.chip-mode.act { cursor: pointer; }

/* progress */
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: block; }
.progress span b { display: block; height: 100%; width: 0; background: var(--turmeric); transition: width .3s ease; }

/* docket */
main { outline: none; flex: 1; }
.ticket { position: relative; background: var(--surface) linear-gradient(var(--pc), var(--pc)) top / 100% 6px no-repeat; border-radius: 8px; padding: 0 0 22px; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 46px; width: 22px; height: 22px; border-radius: 50%; background: var(--wash); margin-top: -11px; }
.ticket::before { left: -11px; }
.ticket::after { right: -11px; }
.stub { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 46px; padding: 6px 22px 0; background: var(--pc-tint); border-radius: 8px 8px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 2px dashed var(--line); }
.stub .no { font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; flex: none; }
.stub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.docket-body { padding: 22px 22px 0; display: flex; flex-direction: column; gap: 18px; }
.screen { animation: rise .26s ease both; }
.still .screen, .still .mcard { animation: none; opacity: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stem { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1.q { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 6.4vw, 33px); line-height: 1.16; margin: 0; text-wrap: balance; outline: none; }
.help { color: var(--muted); font-size: 15px; margin: -6px 0 0; }
.lead { font-size: 17px; margin: 0; }

/* choices */
.opts { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.opts.one { grid-template-columns: 1fr; }
@media (max-width: 420px) { .opts { grid-template-columns: 1fr; } }
.tile { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 56px; padding: 12px 14px; background: var(--bg); background: var(--pc-tint); border: 2px solid transparent; border-radius: 12px; font-size: 17px; font-weight: 500; transition: border-color .15s, background .15s, transform .12s; }
.tile:hover { border-color: var(--pc-line); }
.tile:active { transform: scale(.985); }
.tile .key { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); }
.tile[aria-checked="true"], .tile[aria-pressed="true"] { border-color: var(--pc); background: var(--turmeric-soft); background: var(--pc-soft); }
.tile[aria-checked="true"] .key, .tile[aria-pressed="true"] .key { background: var(--pc); border-color: var(--pc); color: var(--on-pc); }
.tile .em { flex: none; width: 28px; text-align: center; font-size: 23px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.tile.has-em .key { display: none; }
@media (max-width: 559px) { .opts.emo { grid-template-columns: 1fr; } }
.tile[disabled] { opacity: .45; cursor: not-allowed; }
.other-in { width: 100%; padding: 12px 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-size: 17px; }
.counter { font-size: 14px; color: var(--muted); font-weight: 500; }

/* rating bars */
.statement { font-family: var(--display); font-size: clamp(22px, 5.8vw, 29px); line-height: 1.2; margin: 0; text-wrap: balance; outline: none; }
.rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; }
.rate button { border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 108px; justify-content: flex-end; }
.rate .bar { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--line); transition: background .15s, transform .15s; }
.rate button:nth-child(1) .bar { height: 22px; } .rate button:nth-child(2) .bar { height: 38px; } .rate button:nth-child(3) .bar { height: 54px; } .rate button:nth-child(4) .bar { height: 70px; } .rate button:nth-child(5) .bar { height: 86px; }
.rate button:hover .bar { background: var(--surface2); filter: brightness(.96); }
.rate button.on .bar { background: var(--pc); }
.rate button.pick .bar { transform: scaleY(1.04); }
.rate .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rate-ends { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 500; }
.rate-ends span:last-child { text-align: right; }
.rowcount { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }

/* spice */
.chilis { display: flex; gap: 6px; justify-content: space-between; }
.chilis button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; min-height: 96px; border-radius: 8px; color: var(--line); }
.chilis button svg { width: 34px; height: 48px; fill: currentColor; transition: transform .15s; }
.chilis button span { font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
.chilis button.on { color: var(--chili); }
.chilis button.on span { color: var(--ink); }
.chilis button.pick svg { transform: rotate(-8deg) scale(1.1); }

/* menu cards */
.grp { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -4px; }
.menu-cards { display: grid; gap: 12px; }
.mcard { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: start; padding: 10px; border-radius: 16px; background: var(--bg); background: var(--dish-tint); border: 2px solid var(--line); border-color: var(--dish-line); opacity: 0; animation: rise .4s ease both; animation-delay: calc(var(--n, 0) * 60ms); }
@media (max-width: 400px) { .mcard { grid-template-columns: 86px 1fr; gap: 12px; } }
@media (max-width: 349px) { .mcard { grid-template-columns: 1fr; } .mcard .ph { width: 100%; height: auto; aspect-ratio: 16 / 9; } .mcard .ph.noimg svg { width: auto; height: 80%; } }
.ph { position: relative; overflow: hidden; background: var(--dish-soft); display: grid; place-items: center; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph svg { width: 62%; height: 62%; }
.mcard .ph { width: 104px; height: 104px; border-radius: 12px; }
@media (max-width: 400px) { .mcard .ph { width: 86px; height: 86px; } }
.mbody { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nm { font-weight: 700; font-size: 18px; line-height: 1.2; }
.ds { font-size: 14px; color: var(--muted); line-height: 1.35; margin: 0; }
.meta { font-size: 13.5px; line-height: 1.4; }
.meta b { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--dish-soft); }
.chip.warn { background: transparent; border: 1.5px dashed var(--dish); padding: 1px 8px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--leaf); color: #fff; margin-left: 8px; vertical-align: 2px; }
.sp-note { font-size: 14px; color: var(--muted); margin: 0; }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; }

/* tray */
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 340px) { .menu-grid { grid-template-columns: 1fr; } }
.dish { display: flex; flex-direction: column; border-radius: 16px; background: var(--bg); background: var(--dish-tint); border: 2px solid var(--line); border-color: var(--dish-line); transition: border-color .15s, background .15s, transform .12s; }
.dish-main { display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left; width: 100%; padding: 8px 8px 4px; background: transparent; border: 0; border-radius: 14px; flex: 1; }
.dish-main:active { transform: scale(.985); }
.dish .ph { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; }
.dish .nm { font-size: 15px; padding: 0 2px; }
.dish .ds { font-size: 12.5px; padding: 0 2px; }
.dish-info { align-self: flex-start; background: transparent; border: 0; padding: 6px 10px 10px; font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: var(--dish); text-decoration-thickness: 2px; text-underline-offset: 3px; min-height: 36px; }
.dish.on { border-color: var(--dish); background: var(--dish-soft); }
.dish.on .ph::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--dish); color: var(--on-dish); font-weight: 700; font-size: 15px; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.dish.off .dish-main { opacity: .45; cursor: not-allowed; }
.tray { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 50px; padding: 8px 10px; border-radius: 12px; border: 2px dashed var(--pc-line); background: var(--pc-tint); }
.tray .empty { color: var(--muted); font-size: 14px; }
.plate { display: inline-flex; align-items: center; gap: 6px; background: var(--dish); color: var(--on-dish); border-radius: 999px; padding: 3px 6px 3px 3px; font-size: 13px; font-weight: 700; border: 0; animation: rise .2s ease both; }
.plate .ph { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.35); }
.plate .ph svg { width: 78%; height: 78%; }
.plate b { font-size: 16px; line-height: 1; opacity: .8; padding: 0 4px; }

/* details sheet */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(10, 13, 38, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
.sheet { width: min(560px, 100%); max-height: 90%; overflow: auto; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; border-top: 6px solid var(--dish); animation: slideup .28s cubic-bezier(.2,.9,.3,1) both; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 600px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; } }
.sheet .ph { width: 100%; aspect-ratio: 16 / 10; }
.sheet .ph.noimg { aspect-ratio: 16 / 6; }
.sheet .ph.noimg svg { width: auto; height: 82%; }
.sbody { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.sname { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; margin: 0; }
.sbody .meta { font-size: 15px; }
.sbody .chip { font-size: 13.5px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* reaction */
.react-slot:empty { display: none; }
.react { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--pc-soft); border: 2px solid var(--pc-line); font-weight: 500; animation: pop .32s cubic-bezier(.2,1.4,.4,1) both; }
.react .em { font-size: 28px; line-height: 1; flex: none; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.react .rt { flex: 1; }
.react-next { flex: none; border: 0; background: var(--pc); color: var(--on-pc); border-radius: 999px; font-weight: 700; font-size: 14px; padding: 8px 14px; min-height: 38px; }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(6px); } to { opacity: 1; transform: none; } }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
.confetti i { position: absolute; top: -16px; width: 9px; height: 15px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 108vh, 0) rotate(var(--rot)); } }

/* price */
.pricebox { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0 2px; }
.pricebadge { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; font-weight: 500; }
.pricebadge .ph { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--dish); }
.pricelabel { font-family: var(--display); font-size: clamp(52px, 17vw, 84px); line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 8px; }
.pricelabel .cur { font-family: var(--body); font-size: 22px; font-weight: 700; color: var(--muted); }
.pricelabel.unset { color: var(--line); }
.slider { width: 100%; -webkit-appearance: none; appearance: none; height: 36px; background: transparent; margin: 0; }
.slider::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--pc) var(--fill, 0%), var(--line) var(--fill, 0%)); }
.slider::-moz-range-track { height: 10px; border-radius: 5px; background: var(--line); }
.slider::-moz-range-progress { height: 10px; border-radius: 5px; background: var(--pc); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); margin-top: -12px; }
.slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); }
.slider.untouched::-webkit-slider-thumb { border-color: var(--line); }
.slider.untouched::-moz-range-thumb { border-color: var(--line); }
.price-ctl { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: center; }
.step { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 700; line-height: 1; }
.step:hover { border-color: var(--ink); }
.price-in { width: 120px; text-align: center; padding: 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.price-dots { display: flex; gap: 6px; }
.price-dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.price-dots i.on { background: var(--pc); }
.err { color: var(--chili); font-weight: 700; font-size: 14px; min-height: 20px; margin: 0; text-align: center; }

textarea.free { width: 100%; min-height: 130px; padding: 12px 14px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-size: 17px; resize: vertical; }

/* footer buttons */
.foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; position: sticky; bottom: 0; padding-block: 10px calc(4px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--wash) 72%, transparent); z-index: 5; }
.btn { border: 2px solid var(--ink); background: transparent; color: var(--ink); padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 16px; min-height: 50px; }
.btn.primary { background: var(--turmeric); border-color: var(--turmeric); color: var(--on-turmeric); }
.btn.primary:hover:not([disabled]) { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; color: var(--muted); padding-inline: 12px; }
.btn.danger { border-color: var(--chili); color: var(--chili); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.foot .grow { flex: 1; }
.foot.col { flex-direction: column; align-items: stretch; gap: 8px; padding-top: 14px; }
.foot .cq { font-family: var(--display); font-size: 18px; line-height: 1.2; }
.foot .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.big-actions { display: grid; gap: 10px; }

/* welcome / end */
.hero { font-family: var(--display); font-size: clamp(34px, 10vw, 52px); line-height: 1.04; margin: 0; text-wrap: balance; outline: none; }
.consent { background: var(--bg); border-radius: 8px; padding: 14px 16px; font-size: 14.5px; color: var(--muted); line-height: 1.5; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); }
.facts span:nth-child(1) { background: color-mix(in srgb, #5B6CFF 16%, var(--surface)); }
.facts span:nth-child(2) { background: color-mix(in srgb, #2FB67C 18%, var(--surface)); }
.facts span:nth-child(3) { background: color-mix(in srgb, #FF8A3D 18%, var(--surface)); }
.strip { display: flex; gap: 7px; padding: 4px 2px; }
.strip img { flex: 1 1 0; min-width: 0; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 3px solid var(--dish); background: var(--dish-soft); box-shadow: 0 2px 6px rgba(20, 26, 61, .15); }
.strip img:nth-child(odd) { transform: rotate(-3deg); }
.strip img:nth-child(even) { transform: rotate(3deg) translateY(3px); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--dish-soft); border: 2px solid var(--dish-line); font-size: 14px; font-weight: 700; }
.thumb .ph { width: 38px; height: 38px; border-radius: 50%; }
.receipt { background: var(--bg); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.receipt dl { margin: 0; display: grid; gap: 10px; }
.receipt dt { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.receipt dd { margin: 2px 0 0; font-size: 17px; font-weight: 500; }
.status { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; margin: 0; }
.status.ok { color: var(--leaf); } .status.warn { color: var(--chili); } .status.info { color: var(--muted); }

/* admin */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--bg); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.quota { display: grid; gap: 6px; }
.quota .row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
.quota .meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.quota .meter b { display: block; height: 100%; background: var(--turmeric); }
.quota .meter b.done { background: var(--leaf); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .screen, .mcard, .plate, .react, .sheet, .sheet-back { animation: none; opacity: 1; } .confetti { display: none; } .progress span b, .tile, .rate .bar { transition: none; } }
